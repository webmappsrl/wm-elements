<div style="display:flex; gap:1rem; padding:1rem; align-items:center; font-family:sans-serif;">
  <label>shard <input [(ngModel)]="shard" /></label>
  <label>app-id <input [(ngModel)]="appId" /></label>
  <label>layer-id <input [(ngModel)]="layerId" /></label>
  <label>lang <input [(ngModel)]="lang" /></label>
  <label>hide-cta <input type="checkbox" [(ngModel)]="hideCta" /></label>
  <button type="button" (click)="applyPreview()">Applica e ricarica anteprima</button>
</div>
<app-wm-layer-map-root
  *ngIf="showWidget"
  [shard]="previewShard"
  [app-id]="previewAppId"
  [layer-id]="previewLayerId"
  [lang]="previewLang"
  [hide-cta]="previewHideCta ? '' : null"
  style="display:block;width:100%;height:600px"
></app-wm-layer-map-root>

<div style="padding:1rem; font-family:sans-serif;">
  <div style="display:flex; align-items:center; gap:1rem; margin-bottom:0.5rem;">
    <strong>Codice da embeddare</strong>
    <button type="button" (click)="copyEmbedSnippet()">Copia</button>
  </div>
  <pre style="background:#1e1e1e; color:#d4d4d4; padding:1rem; border-radius:6px; overflow-x:auto;"><code>{{ embedSnippet }}</code></pre>
</div>
