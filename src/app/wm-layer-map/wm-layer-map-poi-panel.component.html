<ng-container *ngIf="poiProperties as props">
  <div class="panel-header">
    <button class="panel-close" part="panel-close" aria-label="Chiudi dettaglio" (click)="dismiss.emit()">
      <svg viewBox="0 0 512 512" width="20" height="20" aria-hidden="true">
        <path
          fill="currentColor"
          d="m289.94 256 95-95A24 24 0 0 0 351 127l-95 95-95-95a24 24 0 0 0-34 34l95 95-95 95a24 24 0 1 0 34 34l95-95 95 95a24 24 0 0 0 34-34Z"
        />
      </svg>
    </button>

    <ng-container
      *ngIf="props.taxonomy && props.taxonomy.poi_types as poiTypes; else singlePoiType"
    >
      <div class="poi-category" *ngFor="let poiType of poiTypes">
        <span *ngIf="poiType" [innerHTML]="poiType.name|wmtrans"></span>
      </div>
    </ng-container>
    <ng-template #singlePoiType>
      <div
        class="poi-category"
        *ngIf="props.taxonomy && props.taxonomy.poi_type as poiType"
        [innerHTML]="poiType.name|wmtrans"
      ></div>
    </ng-template>

    <div class="poi-title-row">
      <button
        class="poi-nav-btn"
        *ngIf="showRelatedNav || poiProperties?.related"
        type="button"
        aria-label="POI precedente"
        (click)="prev.emit()"
      >
        <svg viewBox="0 0 512 512" width="20" height="20" aria-hidden="true">
          <path
            fill="currentColor"
            d="M328 112 184 256l144 144a32 32 0 0 1-45.25 45.25L116.69 278.63a32 32 0 0 1 0-45.25L282.75 66.75A32 32 0 0 1 328 112Z"
          />
        </svg>
      </button>

      <p class="panel-title" part="panel-title">{{ props.name|wmtrans }}</p>

      <button
        class="poi-nav-btn"
        *ngIf="showRelatedNav || poiProperties?.related"
        type="button"
        aria-label="POI successivo"
        (click)="next.emit()"
      >
        <svg viewBox="0 0 512 512" width="20" height="20" aria-hidden="true">
          <path
            fill="currentColor"
            d="M184 112 328 256 184 400a32 32 0 0 0 45.25 45.25L395.31 278.63a32 32 0 0 0 0-45.25L229.25 66.75A32 32 0 0 0 184 112Z"
          />
        </svg>
      </button>
    </div>
  </div>

  <div class="poi-panel-body">
    <wm-inner-component-html
      class="poi-excerpt"
      *ngIf="props.excerpt as excerpt"
      [enableDismiss]="false"
      [html]="excerpt|wmtrans"
    ></wm-inner-component-html>

    <wm-tab-image-gallery
      *ngIf="enableGallery && !props.uuid"
      [imageGallery]="props.image_gallery"
    ></wm-tab-image-gallery>

    <wm-ugc-medias [showArrows]="true"></wm-ugc-medias>

    <wm-txn-where
      *ngIf="props.taxonomy_where as txnWhere"
      [taxonomyWheres]="txnWhere"
    ></wm-txn-where>

    <div class="poi-contact-btns">
      <div class="poi-contact-btn" *ngIf="props.address">
        <svg class="poi-contact-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"
          />
        </svg>
        <a
          [href]="'https://www.google.com/maps?daddr=' + (props.address_link !== '' ? props.address_link : props.address) + '&navigate=yes'"
          target="_blank"
          rel="noopener"
        >
          {{ props.address }}
        </a>
      </div>

      <div class="poi-contact-btn" *ngIf="props.ele">
        <svg class="poi-contact-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M19 13H5v-2h14v2z" />
        </svg>
        <p>{{ props.ele }} {{ 'metri'|wmtrans }}</p>
      </div>

      <div class="poi-contact-btn" *ngFor="let phone of contactPhones(props.contact_phone)">
        <svg class="poi-contact-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.07 21 3 13.93 3 5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.24 1.01l-2.2 2.2z"
          />
        </svg>
        <p><a [href]="'tel:' + phone">{{ phone }}</a></p>
      </div>

      <div class="poi-contact-btn" *ngIf="props.contact_email">
        <svg class="poi-contact-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"
          />
        </svg>
        <a [href]="'mailto:' + props.contact_email">{{ props.contact_email }}</a>
      </div>

      <div class="poi-contact-btn poi-contact-btn-urls" *ngIf="props.related_url != null">
        <svg class="poi-contact-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
          />
        </svg>
        <wm-related-urls [relatedUrls]="props.related_url"></wm-related-urls>
      </div>

      <div class="poi-contact-btn" *ngIf="props.osm_url as osm">
        <svg class="poi-contact-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M3.9 12A5 5 0 0 1 8 7h8a5 5 0 0 1 4.1 8H3.9zM12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"
          />
        </svg>
        <a [href]="osm" target="_blank" rel="noopener">{{ 'Vedi su OpenStreetMap'|wmtrans }}</a>
      </div>
    </div>

    <div
      class="poi-description"
      *ngIf="poi?.properties?.uuid == null"
      [innerHTML]="(props.description || props.form?.description)|wmtrans"
    ></div>

    <ng-container *ngIf="props.audio">
      <div class="poi-audio-title">{{ 'Descrizione Audio'|wmtrans }}</div>
      <wm-track-audio [audio]="props.audio"></wm-track-audio>
    </ng-container>

    <wm-form
      *ngIf="props.form"
      class="readonly-form"
      [disabled]="true"
      [confPOIFORMS]="confPOIFORMS$|async"
      [init]="poi?.properties?.form"
    ></wm-form>
  </div>
</ng-container>
